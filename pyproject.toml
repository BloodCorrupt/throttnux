[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "throttnux"
version = "1.0.1" 
description = "A Linux tool to limit the bandwidth of any device on your local network, no router access required."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "rich",
    "questionary",
    "psutil",
    "pyfiglet",
    "Flask"
]

[project.scripts]
throttnux = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "web*"]

[tool.setuptools.package-data]
web = ["templates/*", "static/**/*"] 